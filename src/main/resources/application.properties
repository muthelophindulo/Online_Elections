spring.application.name=Online_Elections
server.port = 8081
spring.application.debug = true
server.address = 0.0.0.0

# databse connection
spring.datasource.url=jdbc:mysql://localhost:3306/online_elections?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=admin1
spring.datasource.password=admin1234.

# hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE